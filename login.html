<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GSM Pay — Crypto Payment Gateway</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <!-- ══ LOGIN SECTION ════════════════════════════════════════════ -->
    <div class="rg-wrap">

        <div class="ln-card">

            <h1 class="ln-title">Merchant Login</h1>
            <p class="ln-sub">Welcome back! Please log in to your merchant account using your email and password.</p>

            <form id="lnForm" novalidate>

                <div class="ln-group">
                    <label class="ln-label">Email</label>
                    <input type="email" class="ln-input" id="lnEmail" placeholder="Enter your email" />
                    <span class="ln-err-msg" id="lnEmailErr"></span>
                </div>

                <div class="ln-group">
                    <label class="ln-label">Password</label>
                    <div class="ln-input-wrap">
                        <input type="password" class="ln-input" id="lnPass" placeholder="Enter password" />
                        <button type="button" class="ln-eye" data-target="lnPass">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                    <span class="ln-err-msg" id="lnPassErr"></span>
                    <div class="ln-forgot-row">
                        <a href="forgot-password.html" class="ln-forgot">Forgot your password?</a>
                    </div>
                </div>
                <button type="submit" class="btn-primary w-100 mt-2" id="lnBtn">Login</button>

            </form>

            <p class="ln-register-row">
                New user? <a href="register.html" class="ln-register-link">Create an account</a>
            </p>

        </div>

        <div class="rg-footer-links">
            <a href="#">Help</a>
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
        </div>

    </div>
    <!-- ══ END LOGIN SECTION ════════════════════════════════════════ -->
    <!-- Bootstrap JS -->
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
